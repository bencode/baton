# pgBackRest for the baton PostgreSQL. Stanza, data path, bucket and keys come
# from PGBACKREST_* in docker-compose.yml; see README.md.
[global]
repo1-type=s3
repo1-s3-endpoint=oss-cn-hangzhou.aliyuncs.com
repo1-s3-region=cn-hangzhou
repo1-retention-full-type=time
repo1-retention-full=30
compress-type=zst
process-max=2
start-fast=y
archive-timeout=120
archive-async=y
spool-path=/var/spool/pgbackrest
# Over this many bytes of unarchived WAL, drop it instead of filling the disk and stopping
# PostgreSQL; PITR breaks there until the next full backup.
archive-push-queue-max=5GiB
log-level-console=info
log-level-file=off
