packages:
  - 'packages/*'

# Install scripts are opt-in (pnpm 11+ fails on unlisted ones). true = run it;
# false = known and deliberately skipped (prebuilt binaries or unused paths).
allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  node-pty: true
  prisma: true
  '@google/genai': false
  '@parcel/watcher': false
  better-sqlite3: false
  esbuild: false
  protobufjs: false

peerDependencyRules:
  allowedVersions:
    '@hono/node-ws>@hono/node-server': '2'
